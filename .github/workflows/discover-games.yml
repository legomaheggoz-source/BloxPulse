name: Discover Roblox Games

on:
  schedule:
    # Run weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HF_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright httpx
          playwright install chromium

      - name: Run game discovery
        run: python backend/scripts/scrape_games.py
        env:
          PYTHONPATH: backend

      - name: Validate discovered games
        run: python backend/scripts/validate_games.py
        env:
          PYTHONPATH: backend

      - name: Commit updated game list
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/discovered_games.json backend/collectors/roblox.py
          git diff --staged --quiet || git commit -m "Update game list from automated discovery

          - Scraped top games from tracking sites
          - Validated against Roblox API
          - Removed invalid/placeholder games

          [skip ci]"

      - name: Push to HuggingFace
        run: |
          git push https://legomaheggo:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/legomaheggo/BloxPulse main
